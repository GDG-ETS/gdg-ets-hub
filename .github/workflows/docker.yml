name: Build & Push Docker Image

on:
  push:
    branches:
      - master
      - main
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  docker:
    name: Build & Push Image
    needs: lint
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    uses: ClubCedille/cedille-workflows/.github/workflows/external-build-push-ghcr.yaml@master
    with:
      container-name: gdg-ets-hub
      context: .
      file: Dockerfile
      branch: master
    secrets:
      GIT_AUTH_TOKEN: ${{ secrets.GIT_AUTH_TOKEN }}
